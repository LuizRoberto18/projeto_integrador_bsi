server {
    listen 80;

    location / {
        proxy_pass https://inclui-map-access.base44.app/;

        
        proxy_set_header Host inclui-map-access.base44.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Essencial para acessar links HTTPS externos sem erro de SSL
        proxy_ssl_server_name on;
    }
}
